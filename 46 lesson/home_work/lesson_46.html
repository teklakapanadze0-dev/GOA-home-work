<!-- grid-template-columns კუთვნილება, რომელიც გამოიყენება იმისთვის რომ grid განლაგებაში განვსაზღვროთ თუ რამდენი და რა ზომის სვეტები გვინდა რომ გვქონდეს. -->

<!-- grid-template-rows კუთვნილება, რომელიც გამოიყენება იმისთვის რომ grid განლაგებაში განვსაზღვროთ თუ რამდენი და რა ზომის რიგი გვინდა რომ გვქონდეს.

grid-template კუთვნილება, რომელიც გამოიყენება იმისთვის რომ grid განლაგებაში განვსაზღვროთ თუ რამდენი და რა ზოსმიდ რიგები და სვეტები გვინდა გვქონდეს (grid-template-columns-ის და grid-template-rows-ის კომბინირებული კუთვნილება)

Example ==>

grid-template: grid-template-rows / grid-template-comlumns;

fr - fractional unit | grid-ის განლგაბეისთვის განკუთვნილი სპეციალური საზომი ერთეული, რომელიც გამოიყენება იმისთვის რომ პროპორციულად გავყოთ სივრცე ელემენტებს შორის და შესაბამისად განვსაზღვროთ column-ების და row-ების სიგრძე / სიგანეები -->
