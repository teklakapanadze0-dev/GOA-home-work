<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="container">

        <div class="result">
            <h3>Your Result</h3>

            <div class="circle">
                <h1>76</h1>
                <p>of 100</p>
            </div>

            <h2>Great</h2>

            <p class="description">
                You scored higher than 65% of the people who have taken these tests.
            </p>
        </div>

        <div class="summary">

            <h3>Summary</h3>

            <div class="box reaction">
                <h4>⚡ Reaction</h4>
                <p><b>80</b> / 100</p>
            </div>

            <div class="box memory">
                <h4>◉ Memory</h4>
                <p><b>92</b> / 100</p>
            </div>

            <div class="box verbal">
                <h4>● Verbal</h4>
                <p><b>61</b> / 100</p>
            </div>

            <div class="box visual">
                <h4>◉ Visual</h4>
                <p><b>73</b> / 100</p>
            </div>

            <button>Continue</button>

        </div>

    </div>

</body>
</html>
